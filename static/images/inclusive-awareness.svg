<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CEC9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Globe circle -->
  <circle cx="100" cy="85" r="40" fill="url(#globeGrad)" opacity="0.15" stroke="url(#globeGrad)" stroke-width="2.5"/>
  <!-- Continents representation -->
  <path d="M 75 70 Q 80 75 85 70 Q 90 75 95 70" fill="url(#globeGrad)" opacity="0.7"/>
  <path d="M 105 80 L 120 85 L 115 95 Z" fill="url(#globeGrad)" opacity="0.6"/>
  <!-- Grid lines -->
  <circle cx="100" cy="85" r="35" fill="none" stroke="url(#globeGrad)" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="85" r="25" fill="none" stroke="url(#globeGrad)" stroke-width="1" opacity="0.3"/>
  <!-- Equator -->
  <line x1="65" y1="85" x2="135" y2="85" stroke="url(#globeGrad)" stroke-width="1.5" opacity="0.4"/>
  <!-- People icons around globe -->
  <g opacity="0.7">
    <circle cx="60" cy="60" r="4" fill="#FF69B4"/>
    <circle cx="140" cy="70" r="4" fill="#FF69B4"/>
    <circle cx="70" cy="130" r="4" fill="#FF69B4"/>
    <circle cx="130" cy="120" r="4" fill="#FF69B4"/>
    <!-- Connection lines -->
    <line x1="60" y1="60" x2="100" y2="85" stroke="#FF69B4" stroke-width="1" opacity="0.4"/>
    <line x1="140" y1="70" x2="100" y2="85" stroke="#FF69B4" stroke-width="1" opacity="0.4"/>
  </g>
</svg>