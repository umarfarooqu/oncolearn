<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CEC9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Padlock body -->
  <rect x="70" y="95" width="60" height="70" rx="8" fill="none" stroke="url(#secureGrad)" stroke-width="3" opacity="0.9"/>
  <!-- Padlock shackle -->
  <path d="M 80 95 Q 80 50 100 45 Q 120 50 120 95" fill="none" stroke="url(#secureGrad)" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="100" cy="125" r="6" fill="url(#secureGrad)" opacity="0.8"/>
  <rect x="98" y="131" width="4" height="8" fill="url(#secureGrad)" opacity="0.8"/>
  <!-- Security indicator shine -->
  <g opacity="0.5">
    <circle cx="85" cy="110" r="3" fill="url(#secureGrad)"/>
    <circle cx="115" cy="130" r="2" fill="url(#secureGrad)"/>
  </g>
  <!-- Check mark inside -->
  <path d="M 95 120 L 100 125 L 108 115" stroke="#00CEC9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>