<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D81B60;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Lightbulb outline -->
  <path d="M 100 40 C 115 40 125 50 125 65 C 125 80 115 90 100 90 L 100 90 C 85 90 75 80 75 65 C 75 50 85 40 100 40 Z" fill="url(#actionGrad)" opacity="0.2" stroke="url(#actionGrad)" stroke-width="2.5"/>
  <!-- Filament -->
  <path d="M 95 85 Q 95 100 100 110 Q 105 100 105 85" fill="none" stroke="url(#actionGrad)" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="92" y="110" width="16" height="8" rx="2" fill="url(#actionGrad)" opacity="0.7"/>
  <!-- Rays of light -->
  <g stroke="url(#actionGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="25" x2="100" y2="15"/>
    <line x1="140" y1="65" x2="150" y2="55"/>
    <line x1="60" y1="65" x2="50" y2="55"/>
    <line x1="142" y1="40" x2="155" y2="27"/>
    <line x1="58" y1="40" x2="45" y2="27"/>
  </g>
  <!-- Glow effect -->
  <circle cx="100" cy="65" r="35" fill="none" stroke="url(#actionGrad)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="r" values="35;42;35" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>