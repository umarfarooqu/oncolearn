<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="learningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CEC9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Open book -->
  <path d="M 60 50 L 60 150 Q 100 160 100 160 Q 100 160 140 150 L 140 50 Z" fill="url(#learningGrad)" opacity="0.15" stroke="url(#learningGrad)" stroke-width="2.5"/>
  <!-- Book spine -->
  <line x1="100" y1="50" x2="100" y2="160" stroke="url(#learningGrad)" stroke-width="3" opacity="0.8"/>
  <!-- Pages -->
  <path d="M 65 65 L 95 65" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 65 80 L 95 80" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 65 95 L 95 95" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 65 110 L 95 110" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 65 125 L 95 125" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Right pages -->
  <path d="M 105 65 L 135 65" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 105 80 L 135 80" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 105 95 L 135 95" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 105 110 L 135 110" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <path d="M 105 125 L 135 125" stroke="url(#learningGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Bookmark -->
  <rect x="140" y="45" width="8" height="70" rx="2" fill="#FF69B4" opacity="0.7"/>
</svg>